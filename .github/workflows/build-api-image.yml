name: Build Engram API Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/build-api-image.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check Azure Container Registry secrets
        run: |
          test -n "${{ secrets.ACR_LOGIN_SERVER }}"
          test -n "${{ secrets.ACR_USERNAME }}"
          test -n "${{ secrets.ACR_PASSWORD }}"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/build-push-action@v7
        with:
          context: ./api
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/engram-api:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/engram-api:${{ github.sha }}
