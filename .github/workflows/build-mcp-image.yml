name: Build Engram MCP Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mcp/**"
      - ".github/workflows/build-mcp-image.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./mcp
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/engram-mcp:latest
            ghcr.io/${{ github.repository_owner }}/engram-mcp:${{ github.sha }}
