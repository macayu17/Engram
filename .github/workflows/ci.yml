name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://engram@localhost:5432/engram
      ENGRAM_TEST_DATABASE_URL: postgresql://engram@localhost:5432/engram
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: engram
          POSTGRES_DB: engram
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engram -d engram"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m compileall api
      - run: python -m pip install -r api/requirements-dev.txt
      - run: python -m api.apply_schema
      - run: python -m pytest api

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
        working-directory: mcp
      - run: npm run build
        working-directory: mcp
      - run: npm run verify:defaults
        working-directory: mcp
      - run: npm run verify:auth
        working-directory: mcp
      - run: npm run verify:plugins
        working-directory: mcp

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run verify:clerk
        working-directory: dashboard
      - run: npm run verify:logic
        working-directory: dashboard
      - run: npm run verify:conflicts
        working-directory: dashboard
      - run: npm run verify:billing
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
